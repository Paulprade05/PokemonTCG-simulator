<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Sin conexión · Pokémon TCG Simulator</title>
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: calc(env(safe-area-inset-top) + 2rem) 1.75rem
          calc(env(safe-area-inset-bottom) + 2rem);
        text-align: center;
        /* Paleta papel de la app (globals.css): carbón kraft + marfil,
           lavado esmeralda arriba como en el body real. */
        background:
          radial-gradient(
            ellipse 80% 50% at 50% 0%,
            rgba(16, 185, 129, 0.14),
            transparent 70%
          ),
          #14120c;
        color: #efe9db;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      img {
        width: 92px;
        height: 92px;
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      }
      h1 {
        margin: 0;
        font-size: 1.4rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        max-width: 30ch;
        font-size: 0.9rem;
        line-height: 1.6;
        color: rgba(239, 233, 219, 0.6);
      }
      button {
        margin-top: 0.5rem;
        padding: 0.85rem 2rem;
        border: 0;
        border-radius: 999px;
        font: inherit;
        font-weight: 600;
        font-size: 0.9rem;
        color: #04110c;
        background: linear-gradient(135deg, #10b981, #06b6d4);
        box-shadow: 0 12px 30px rgba(16, 185, 129, 0.3);
      }
      button:active {
        transform: scale(0.96);
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="" />
    <h1>Sin conexión</h1>
    <p>
      Las cartas que ya has visto siguen guardadas. Vuelve a intentarlo cuando
      recuperes la señal.
    </p>
    <button onclick="location.reload()">Reintentar</button>
  </body>
</html>
