<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14120c" />
    <title>Sin conexión · Pokémon TCG Simulator</title>
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-v2.png" />
    <!--
      ESTA PÁGINA TIENE QUE VALERSE SOLA: la sirve el service worker cuando no
      hay red ni copia guardada de la pantalla pedida, así que no puede cargar
      la hoja de estilos ni el JavaScript de la app. Todo va en línea.

      POR QUÉ TIENE TRES SALIDAS Y NO UNA. En la app instalada no hay barra de
      direcciones ni botón atrás, y antes aquí sólo había "Reintentar", que
      recarga la misma dirección sin red: quien caía aquí tocando una pestaña
      tenía que matar la app. Ahora puede volver a donde estaba, ir al inicio
      (que sí suele estar guardado) o esperar: la página se recarga sola en
      cuanto vuelve la señal.
    -->
    <script>
      // El tema, con la misma regla que el script de arranque de
      // app/layout.tsx: lo elegido en Ajustes y, si no hay nada, el del
      // sistema. Va dentro de try porque con el almacenamiento bloqueado
      // tocar localStorage lanza.
      (function () {
        var t;
        try {
          t = localStorage.getItem("theme");
          if (!t) {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
        } catch (e) {
          t = "dark";
        }
        if (t !== "light") t = "dark";
        document.documentElement.setAttribute("data-theme", t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "dark" ? "#14120c" : "#f4efe4");
      })();
    </script>
    <style>
      /* Paleta papel de la app (globals.css): carbón kraft y marfil en oscuro,
         crema y tinta en claro, con el lavado esmeralda de arriba. */
      :root {
        color-scheme: dark;
        --bg: #14120c;
        --ink: #efe9db;
        --ink-soft: rgba(239, 233, 219, 0.64);
        --borde: rgba(240, 230, 208, 0.2);
        --lavado: rgba(16, 185, 129, 0.14);
        --sombra: rgba(0, 0, 0, 0.6);
      }
      html[data-theme="light"] {
        color-scheme: light;
        --bg: #f4efe4;
        --ink: #2b241a;
        --ink-soft: #6d6353;
        --borde: rgba(87, 66, 33, 0.26);
        --lavado: rgba(16, 185, 129, 0.12);
        --sombra: rgba(62, 50, 32, 0.28);
      }
      * {
        box-sizing: border-box;
      }
      html {
        height: 100%;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        /* min-height y no height: en apaisado el contenido no cabe en el alto
           de la pantalla y tiene que poder desplazarse en vez de recortarse. */
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.1rem;
        /* Las cuatro zonas seguras: arriba el notch, abajo la barra de inicio y
           a los lados el recorte cuando el teléfono está en apaisado. */
        padding: calc(env(safe-area-inset-top, 0px) + 1.5rem)
          max(env(safe-area-inset-right, 0px), 1.5rem)
          calc(env(safe-area-inset-bottom, 0px) + 1.5rem)
          max(env(safe-area-inset-left, 0px), 1.5rem);
        text-align: center;
        background:
          radial-gradient(
            ellipse 80% 50% at 50% 0%,
            var(--lavado),
            transparent 70%
          ),
          var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      img {
        width: 84px;
        height: 84px;
        border-radius: 22px;
        box-shadow: 0 18px 44px var(--sombra);
      }
      h1 {
        margin: 0;
        font-size: 1.4rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        max-width: 32ch;
        font-size: 0.9rem;
        line-height: 1.55;
        color: var(--ink-soft);
      }
      #estado {
        min-height: 1.4em;
        font-size: 0.8rem;
      }
      .acciones {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        width: 100%;
        max-width: 17rem;
        margin-top: 0.25rem;
      }
      .boton {
        display: flex;
        align-items: center;
        justify-content: center;
        /* 48 px: por encima de los 44 que pide un objetivo táctil. */
        min-height: 48px;
        padding: 0 1.25rem;
        border: 1px solid var(--borde);
        border-radius: 999px;
        font: inherit;
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--ink);
        background: transparent;
        text-decoration: none;
        cursor: pointer;
        -webkit-appearance: none;
        appearance: none;
      }
      .boton[hidden] {
        display: none;
      }
      .boton:active {
        opacity: 0.7;
      }
      .boton.principal {
        border-color: transparent;
        color: #04110c;
        background: linear-gradient(135deg, #10b981, #06b6d4);
        box-shadow: 0 10px 26px rgba(16, 185, 129, 0.28);
      }
      .boton:focus-visible {
        outline: 2px solid #10b981;
        outline-offset: 3px;
      }
      /* Apaisado en un teléfono: el alto no da para la columna entera. El icono
         encoge y los botones se ponen en fila. */
      @media (max-height: 480px) {
        body {
          gap: 0.7rem;
        }
        img {
          width: 52px;
          height: 52px;
          border-radius: 14px;
        }
        .acciones {
          flex-direction: row;
          flex-wrap: wrap;
          justify-content: center;
          max-width: 34rem;
        }
        .acciones .boton {
          flex: 1 1 9rem;
        }
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="" />
    <h1>Sin conexión</h1>
    <p>
      Esta pantalla no se ha podido cargar. Las cartas que ya has visto siguen
      guardadas, y en cuanto vuelva la señal se recargará sola.
    </p>
    <p id="estado" role="status" aria-live="polite"></p>
    <div class="acciones">
      <button type="button" class="boton principal" id="reintentar">
        Reintentar
      </button>
      <button type="button" class="boton" id="volver" hidden>Volver</button>
      <a class="boton" id="inicio" href="/?source=pwa">Ir al inicio</a>
    </div>
    <script>
      (function () {
        var estado = document.getElementById("estado");
        var enMarcha = false;
        function recargar(mensaje) {
          if (enMarcha) return;
          enMarcha = true;
          if (estado) estado.textContent = mensaje;
          location.reload();
        }

        document.getElementById("reintentar").addEventListener(
          "click",
          function () {
            recargar("Reintentando…");
          },
        );

        // "Volver" sólo si hay adónde: recién abierta la app el historial
        // tiene una sola entrada y el botón no haría nada.
        var volver = document.getElementById("volver");
        if (history.length > 1) {
          volver.hidden = false;
          volver.addEventListener("click", function () {
            history.back();
          });
        }

        // Si lo que no ha cargado es el propio inicio, el enlace traería de
        // vuelta aquí: se retira en vez de ofrecer una salida que no lo es.
        if (location.pathname === "/") {
          document.getElementById("inicio").hidden = true;
        }

        // LA SEÑAL VUELVE: el evento del sistema es el camino normal.
        window.addEventListener("online", function () {
          recargar("Conexión recuperada. Recargando…");
        });

        // Y un segundo cinturón, porque en la app instalada de iOS ese evento
        // no siempre llega: cada veinte segundos, y al volver a primer plano,
        // se pregunta por un fichero estático con HEAD (el service worker sólo
        // atiende GET, así que la pregunta llega a la red de verdad). Si
        // contesta, hay red y se recarga. El sello en sessionStorage impide
        // que esto recargue más de una vez cada treinta segundos si la página
        // siguiera sin cargar por otro motivo; sin almacenamiento no se
        // recarga sola por esta vía, que es lo prudente.
        function puedeRecargarSola() {
          try {
            var ultima = Number(sessionStorage.getItem("tcg-offline-auto")) || 0;
            if (Date.now() - ultima < 30000) return false;
            sessionStorage.setItem("tcg-offline-auto", String(Date.now()));
            return true;
          } catch (e) {
            return false;
          }
        }
        function sondear() {
          if (enMarcha || document.visibilityState !== "visible") return;
          if (typeof fetch !== "function") return;
          fetch("/manifest.webmanifest", { method: "HEAD", cache: "no-store" })
            .then(function (res) {
              if (res && res.ok && puedeRecargarSola()) {
                recargar("Conexión recuperada. Recargando…");
              }
            })
            .catch(function () {
              /* sigue sin red: se vuelve a preguntar en el siguiente turno */
            });
        }
        setInterval(sondear, 20000);
        document.addEventListener("visibilitychange", sondear);
      })();
    </script>
  </body>
</html>
